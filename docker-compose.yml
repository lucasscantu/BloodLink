services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hospitalchain-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospitalchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hospitalchain-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalchain-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hospitalchain?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      BLOCKCHAIN_URL: http://blockchain:8545
      BLOCKCHAIN_CHAIN_ID: 1337
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - hospitalchain-network

  # Blockchain Node (Hardhat)
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: hospitalchain-blockchain
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
      - /app/node_modules
    command: npx hardhat node
    networks:
      - hospitalchain-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitalchain-frontend
    environment:
      VITE_API_URL: http://backend:4000
      VITE_BLOCKCHAIN_URL: http://blockchain:8545
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - hospitalchain-network

volumes:
  postgres_data:

networks:
  hospitalchain-network:
    driver: bridge
