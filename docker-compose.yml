# Docker Compose Configuration for HospitalChain
# Academic prototype for blood bag traceability using blockchain
#
# Usage:
#   Development (with hot-reload):
#     docker-compose -f docker-compose.yml up -d
#
#   Production:
#     docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Services:
#   - postgres: PostgreSQL database
#   - backend: Node.js/Express API server
#   - blockchain: Hardhat Ethereum node
#   - frontend: React/Vite application

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hospitalchain-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospitalchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - hospitalchain-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hospitalchain-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hospitalchain?schema=public
      JWT_SECRET: dev-secret-key-change-in-production
      BLOCKCHAIN_URL: http://blockchain:8545
      BLOCKCHAIN_CHAIN_ID: 1337
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"
    restart: unless-stopped
    networks:
      - hospitalchain-network

  # Blockchain Node (Hardhat)
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile.dev
    container_name: hospitalchain-blockchain
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
      - /app/node_modules
    command: sh -c "npm install && npx hardhat node --host 0.0.0.0"
    restart: unless-stopped
    networks:
      - hospitalchain-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hospitalchain-frontend
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_BLOCKCHAIN_URL: http://localhost:8545
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - hospitalchain-network

volumes:
  postgres_data:

networks:
  hospitalchain-network:
    driver: bridge
