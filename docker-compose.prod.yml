# Docker Compose Production Configuration for HospitalChain
# Use this file for production deployments
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This configuration:
#   - Uses production-optimized images
#   - Disables hot-reload
#   - Uses proper restart policies
#   - Configures proper resource limits

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hospitalchain-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospitalchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hospitalchain-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalchain-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hospitalchain?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key}
      BLOCKCHAIN_URL: http://blockchain:8545
      BLOCKCHAIN_CHAIN_ID: 1337
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    networks:
      - hospitalchain-network

  # Blockchain Node (Hardhat)
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: hospitalchain-blockchain
    ports:
      - "8545:8545"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    networks:
      - hospitalchain-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitalchain-frontend
    environment:
      VITE_API_URL: http://backend:4000
      VITE_BLOCKCHAIN_URL: http://blockchain:8545
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    networks:
      - hospitalchain-network

volumes:
  postgres_data:

networks:
  hospitalchain-network:
    driver: bridge
